name = "ktm-os-worker"
main = "src/index.js"
compatibility_date = "2024-04-17"

# [vars]
# DISCORD_PUBLIC_KEY = "..."
# DISCORD_TOKEN = "..."
# LOCAL_API_URL = "..."
# PORTAL_API_URL = "https://ktm-portal.vercel.app"

[triggers]
# 定期カスタム関連のスケジュール（時刻はJST）
#  "0 15 * * 6"     : 毎週日曜 0:00 JST (土曜 UTC 15:00) 前回の募集締め切り＆今週土曜21時開催の定期募集自動投稿
#  "0 11 * * 3,5,6" : 毎週水・金・土 20:00 JST (UTC 11:00) 人数集計・同期アナウンス通知
#  "*/10 * * * *"   : 10分ごと 開始時刻が近い募集の参加者へリマインド(D1)
crons = [ "0 15 * * 6", "0 11 * * 3,5,6", "*/10 * * * *" ]
