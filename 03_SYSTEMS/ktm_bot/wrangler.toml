name = "ktm-os-worker"
main = "src/index.js"
compatibility_date = "2024-04-17"

# [vars]
# DISCORD_PUBLIC_KEY = "..."
# DISCORD_TOKEN = "..."
# LOCAL_API_URL = "..."
# PORTAL_API_URL = "https://ktm-portal.vercel.app"

[triggers]
# 定期カスタム関連のスケジュール（時刻はJST）
# 2026-08-01: 真の根本原因が判明。Cloudflare Workers Cron Triggersの曜日番号は
# 「1=日曜〜7=土曜」で、Vercel/GitHub Actions等が使う標準Unix cron「0=日曜〜6=土曜」
# とズレている（Cloudflare公式ドキュメントで確認済み。実際"0 15 * * 0"をデプロイ
# しようとしたところ「invalid cron string」でCloudflareに拒否され、0が受理されない
# ことで確定した）。旧設定"0 15 * * 6"はUnix基準の「土曜」のつもりだったが、
# Cloudflare基準では6=金曜と解釈されており、これが「1日早く届く」不具合の真因だった。
# 以下はCloudflareの番号体系（1=日,2=月,3=火,4=水,5=木,6=金,7=土）で書き直した正しい値。
#  "0 15 * * 7"     : 毎週日曜 0:00 JST (土曜 UTC 15:00) 前回の募集締め切り＆今週土曜21時開催の定期募集自動投稿
#  "0 11 * * 4,6,7" : 毎週水・金・土 20:00 JST (UTC 11:00) 人数集計・同期アナウンス通知
#  "*/10 * * * *"   : 10分ごと 開始時刻が近い募集の参加者へリマインド(D1)
crons = [ "0 15 * * 7", "0 11 * * 4,6,7", "*/10 * * * *" ]
