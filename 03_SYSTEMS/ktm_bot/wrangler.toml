name = "ktm-os-worker"
main = "src/index.js"
compatibility_date = "2024-04-17"

# [vars]
# DISCORD_PUBLIC_KEY = "..."
# DISCORD_TOKEN = "..."
# LOCAL_API_URL = "..."
# PORTAL_API_URL = "https://ktm-portal.vercel.app"

[triggers]
crons = [
  "0 3 * * 3",     # ① 毎週水曜 12:00 JST: 週末定期カスタム募集開始 (UTC 03:00 水)
  "0 10 * * 5",    # ② 毎週金曜 19:00 JST: 中間アナウンス・リマインド通知 (UTC 10:00 金)
  "0 8 * * 6,7",   # ③ 毎週土日 17:00 JST: 中間アナウンス・リマインド通知 (UTC 08:00 土日)
  "0 11 * * 6,7",  # ④ 毎週土日 20:00 JST: 開催判定（開催1時間前・不足時代替募集） (UTC 11:00 土日)
  "0 0 * * 1"      # ⑤ 毎週月曜 09:00 JST: 週間レポート配信 (UTC 00:00 月)
]

