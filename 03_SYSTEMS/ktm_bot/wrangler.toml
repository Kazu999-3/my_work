name = "ktm-os-worker"
main = "src/index.js"
compatibility_date = "2024-04-17"

# [vars]
# DISCORD_PUBLIC_KEY = "..."
# DISCORD_TOKEN = "..."
# LOCAL_API_URL = "..."
# PORTAL_API_URL = "https://ktm-portal.vercel.app"

[triggers]
# 定期カスタム関連のスケジュール（時刻はJST）
# 2026-08-01: 「日曜0:00 JSTに来るはずが土曜0:00 JSTに来た(1日早い)」と実際に観測されたため、
# 暫定対応として両方の曜日を1つ後ろにずらした（根本原因はCloudflareの実デプロイ設定側の
# ズレか、INTERNAL_GAS_SECRET経由の想定外トリガーの可能性があり未特定。この変更後も
# ズレが再現する場合はそちらを疑うこと）。
#  "0 15 * * 0"     : 毎週月曜 0:00 JST (日曜 UTC 15:00) 前回の募集締め切り＆今週土曜21時開催の定期募集自動投稿
#  "0 11 * * 4,6,0" : 毎週木・土・日 20:00 JST (UTC 11:00) 人数集計・同期アナウンス通知
#  "*/10 * * * *"   : 10分ごと 開始時刻が近い募集の参加者へリマインド(D1)
crons = [ "0 15 * * 0", "0 11 * * 4,6,0", "*/10 * * * *" ]
