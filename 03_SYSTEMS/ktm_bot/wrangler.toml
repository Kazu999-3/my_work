name = "ktm-os-worker"
main = "src/index.js"
compatibility_date = "2024-04-17"

# [vars]
# DISCORD_PUBLIC_KEY = "..."
# DISCORD_TOKEN = "..."
# LOCAL_API_URL = "..."
# PORTAL_API_URL = "https://ktm-portal.vercel.app"

[triggers]
# ⚠️ Cloudflare Workers Cron Triggersの曜日フィールドは「1=日曜〜7=土曜」という
# 独自体系(標準Unix cronの「0=日曜〜6=土曜」とは1つズレる)。2026-08-01に一度この
# 混同を修正した実績があるが、本ファイルには標準Unix流の数字が残ったまま再発していた
# (2026-09-21発覚: 全5本が意図より1日早く発火。特に④の日曜20:00開催判定はCF側では
# 一度も発火せず機能停止していた)。以下はCloudflareの体系で書き直した正しい値。
crons = [
  "0 3 * * 4",     # ① 毎週水曜 12:00 JST: 週末定期カスタム募集開始 (UTC 03:00 水, CF dow=4)
  "0 10 * * 6",    # ② 毎週金曜 19:00 JST: 中間アナウンス・リマインド通知 (UTC 10:00 金, CF dow=6)
  "0 8 * * 7,1",   # ③ 毎週土日 17:00 JST: 中間アナウンス・リマインド通知 (UTC 08:00 土日, CF dow=7,1)
  "0 11 * * 7,1",  # ④ 毎週土日 20:00 JST: 開催判定（開催1時間前・不足時代替募集） (UTC 11:00 土日, CF dow=7,1)
  "0 0 * * 2"      # ⑤ 毎週月曜 09:00 JST: 週間レポート配信 (UTC 00:00 月, CF dow=2)
]

