name = "ktm-os-worker"
main = "src/index.js"
compatibility_date = "2024-04-17"

# [vars]
# DISCORD_PUBLIC_KEY = "..."
# DISCORD_TOKEN = "..."
# LOCAL_API_URL = "..."
# PORTAL_API_URL = "https://ktm-portal.vercel.app"

[triggers]
# 定期カスタム関連のスケジュール（時刻はJST）
# Cloudflare Workersの曜日番号: 1=日, 2=月, 3=火, 4=水, 5=木, 6=金, 7=土
#  "0 3 * * 2"  : 毎週月曜 12:00 JST (UTC 3:00 月曜=dow 2) 週末定期カスタム募集（土日分）自動投稿
#  "0 3 * * 4"  : 毎週水曜 12:00 JST (UTC 3:00 水曜=dow 4) 人数集計・中間アナウンス通知
#  "0 10 * * 6" : 毎週金曜 19:00 JST (UTC 10:00 金曜=dow 6) 前日人数集計・最終アナウンス通知
#  "0 0 * * 2"  : 毎週月曜 9:00 JST (UTC 0:00 月曜=dow 2) 個人週間レポート配信
#  "0 3 1 * *"  : 毎月1日 12:00 JST (UTC 3:00) 月間アワード表彰の自動投稿
crons = [ "0 3 * * 2", "0 3 * * 4", "0 10 * * 6", "0 0 * * 2", "0 3 1 * *" ]
