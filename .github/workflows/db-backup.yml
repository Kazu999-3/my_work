name: Database Backup

# 個人開発かつSupabase無料プランのためPITR(Point-in-Time Recovery)が使えず、
# 障害・誤操作時にDBを復旧する手段が無かった(2026-08-04発覚)。
# 無料でできる代替策として、毎日論理バックアップ(pg_dump)を取得し、
# GitHub Actionsの非公開Artifactとして保持する。
#
# 【重要】このリポジトリは公開リポジトリのため、バックアップファイルは
# 絶対にgitへコミットしない。actions/upload-artifactのみで保存し、
# 30日で自動失効させる。
#
# 復元したい場合: このワークフローの実行結果ページからArtifactをダウンロードし、
#   pg_restore --clean --if-exists -d "$DATABASE_URL" backup.dump

on:
  schedule:
    - cron: '0 18 * * *'  # 毎日 UTC18:00 = JST 03:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # 失敗時にIssueを立てて気づけるようにする

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client tools (Supabase側と同一メジャーバージョン)
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # PGDGパッケージはバージョン別ディレクトリに入り、素の`pg_dump`はOS標準の
          # 古いバージョン(16系)を指したままになる既知の挙動があるため、
          # インストールしたv17のバイナリをフルパスで明示する。
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=custom --file=backup.dump

      - name: Verify dump is non-empty (silent失敗の検知)
        run: |
          size=$(stat -c%s backup.dump)
          echo "Dump size: ${size} bytes"
          if [ "$size" -lt 1000 ]; then
            echo "::error::バックアップのサイズが異常に小さい(${size} bytes)。失敗している疑いがあります。"
            exit 1
          fi

      - name: Upload backup as private artifact (gitへは絶対にコミットしない)
        uses: actions/upload-artifact@v7
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 30

      # 失敗しても気づける仕組みが無く、2026-09-22〜10-04の12日間、DBパスワード不一致で毎日失敗していた
      # （GitHubの失敗メールだけでは見落とした）。失敗時はIssueを立て、同じIssueが開いていれば追記する。
      - name: 失敗をIssueで知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🚨 DBバックアップが失敗しています"
          BODY=$(printf '%s\n' "Supabaseの日次バックアップ(pg_dump)が失敗しました。バックアップは30日で失効するため、放置すると復元手段が無くなります。よくある原因: Secrets の DATABASE_URL のパスワードがDB側と食い違っている。" "" "- 実行ログ: $RUN_URL" "- 日時(UTC): $(date -u +%Y-%m-%dT%H:%MZ)")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
