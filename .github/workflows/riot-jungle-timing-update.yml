name: Riot Jungle Timing Update

# ⑤(ジャングル序盤タイミングのAI推定が不正確)・①(Riot APIで面白い情報ないの？)への対応。
# エメラルド帯の実試合(Match Timeline API)からコアアイテム完成タイミングの実測値を収集し、
# champion_jungle_timing_samples/aggへ保存する。フルクリア時間はRiot集計側の指標選定ミス
# (累積カウンタを60秒間隔で誤判定、2026-08-15発覚)によりjunglepedia.lolの実データへ切替済み。
# どちらもネットワーク取得とSupabase REST APIへの直接書き込みのみでローカルファイルへの
# 書き込みを行わないため、lane-role-update.ymlと同様にd:/my_work シンボリックリンクの
# 回避策は不要。

on:
  schedule:
    - cron: '0 18 * * 4'   # 毎週金曜 03:00 JST（木曜18:00 UTC）
  workflow_dispatch:        # 手動実行用

jobs:
  riot-jungle-timing-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 03_SYSTEMS/requirements.txt

      - name: Run Riot jungle timing collector
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          PYTHONPATH: 03_SYSTEMS
        run: |
          python 03_SYSTEMS/v2_CORE/_LOL/riot_jungle_timing_collector.py

      # フルクリア時間はRiot集計側の指標選定ミス(2026-08-15発覚)によりjunglepedia.lolの
      # 実データへ切り替えた。RIOT_API_KEYの24時間失効の制約を受けないため同じジョブに同居させる。
      - name: Run Junglepedia clear-time collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          PYTHONPATH: 03_SYSTEMS
        run: |
          python 03_SYSTEMS/v2_CORE/_LOL/junglepedia_clear_collector.py
