name: SoloQ Coach Poll

# Vercel HobbyプランはCronジョブを1日1回までしか許可していないため、
# 試合終了を早めに検知したい /api/cron/soloq-coach の高頻度呼び出しは
# こちらのGitHub Actionsで代替する。実際の分析ロジック(振り返り生成・
# coach_analysesへの保存・ポータル通知)は全てVercel側にあるので、
# ここでは15分おきにそのURLを叩くだけの薄いポーラー。
# 必要シークレット: VERCEL_CRON_SECRET (Vercelの環境変数 CRON_SECRET と同じ値)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger soloq-coach review check
        env:
          CRON_SECRET: ${{ secrets.VERCEL_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::VERCEL_CRON_SECRET未設定のためスキップ"; exit 0; fi
          # 以前はcurlの終了コードだけを見ており、curl自体は通信できてさえいれば
          # 401/500等のエラー応答でも「success」扱いになっていた。そのため
          # コーチの振り返り/傾向が何日も更新されなくても、このワークフロー自体は
          # ずっと緑のまま気付けなかった。レスポンス本文とHTTPステータスを検査し、
          # 200以外なら明示的に失敗させる。
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "https://my-work-8jbd.vercel.app/api/cron/soloq-coach" -H "Authorization: Bearer $CRON_SECRET")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "status=$STATUS body=$BODY"
          if [ "$STATUS" != "200" ]; then
            echo "::error::soloq-coach check failed with HTTP $STATUS: $BODY"
            exit 1
          fi
