name: YouTube Channel Monitor & Auto-Enqueue

# YouTube監視チャンネルを定期巡回し、新着動画を自動で youtube_queue へ起票する。
# PC常駐デーモンに依存せず、GitHub Actions クラウド上で定期実行（1日3回）。
# RSSフィード取得のため yt-dlp を使わず、IP制限や429の影響を受けない。

on:
  schedule:
    # 08:00 / 14:00 / 20:00 (JST) = 23:00 / 05:00 / 11:00 (UTC)
    - cron: '0 23,5,11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv

      - name: Run Cloud YouTube Monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python scripts/cloud_youtube_monitor.py
