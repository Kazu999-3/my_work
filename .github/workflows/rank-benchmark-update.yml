name: Rank Benchmark Update

# 目標ランクの実測平均用サンプル収集（2026-10-06新設）
#
# 05 コーチ「試合後」タブの「目標との比較」は、目標ランク・同じロールのプレイヤーの実際の平均値と
# 自分の成績を並べる。その平均の元データ(rank_benchmark_samples, migration 88)をここで毎日貯める。
# 1回で約200人を見て、直近14日に試合のある人の1試合ずつ（Riot API 約320回・新規約60試合）。
# 平均はDB関数が直近30日分から計算する。
#
# 【失敗を隠さない】キー失効・新規0件・保存失敗はスクリプトが終了コード1を返し、このジョブが赤くなる。
# 既存のジャングル収集のように「静かにスキップして緑」にはしない（止まった自動化に誰も気づかない事故の再発防止）。
# 画面側にも最終収集日を出しているので、ここが止まると「目標との比較」に古い日付が表示される。

on:
  schedule:
    - cron: '30 19 * * *'   # 毎日 04:30 JST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 03_SYSTEMS/requirements.txt

      - name: Collect target-rank samples
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          PYTHONPATH: 03_SYSTEMS
        run: |
          python 03_SYSTEMS/v2_CORE/_LOL/rank_benchmark_collector.py
