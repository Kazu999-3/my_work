name: KTM Cloud Worker

# PC常駐デーモンの代替(#88)。
#  - prospect: 1日1回、辞典が古いチャンピオンの解説動画を探してキューに積む
#  - youtube: youtube_queue を処理（yt-dlp字幕→Gemini要約→ナレッジ保存）。
#             2026-07-31: 定期実行を停止した。cookie/クライアント周りを直しても
#             GitHub Actionsの共有IP自体がYouTube側から低信用と判定され、動画に
#             よって取得に失敗し続ける（同じ動画を別IPから叩くと成功する）。
#             クラウドで安定しないため、workflow_dispatchでの手動実行のみ残す。
#  - dict-sync: 3時間おきに承認済みのナレッジをチャンピオン辞典へ統合（05_PILOT /api/knowledge/integrate）
#
# 元々は prospect が動画を見つける → youtube が解析する → dict-sync が辞典へ反映する、
# という流れだったが、youtubeジョブの定期実行停止により現在は手動実行が必要。
# 必要シークレット: SUPABASE_URL, SUPABASE_SERVICE_KEY, GEMINI_API_KEY, PILOT_SECRET_TOKEN

on:
  schedule:
    - cron: '7 */3 * * *'    # dict-sync
    # prospect は 3:30 / 11:30 / 19:30 JST の1日3回。
    # 発掘自体はGeminiを使わず、解析待ちが溜まっていれば自動で見送るため、
    # 頻度を上げてもAPIの消費は youtube ジョブの処理速度で頭打ちになる。
    - cron: '30 18,2,10 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: '実行するジョブ'
        required: true
        default: 'both'
        type: choice
        options:
          - both          # youtube + dict-sync
          - youtube       # キューの動画を解析する
          - dict-sync     # ナレッジを辞典へ同期する
          - prospect      # 解説動画を探してキューに積む
      champions:
        description: 'prospect用: 対象を直接指定（例: Ahri,Graves。空なら辞典が古い順）'
        required: false
        default: ''

jobs:
  # 解析対象の動画を自動で発掘してキューに積む（v2_CORE/prospector.py の後継）
  prospect:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'prospect' || (github.event_name == 'schedule' && github.event.schedule == '30 18,2,10 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Install yt-dlp
        run: pip install -q yt-dlp
      - name: Check Environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/check_env.py
      - name: Prospect videos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          PROSPECT_CHAMPIONS: ${{ github.event.inputs.champions }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/prospector.py

  youtube:
    # 定期cronは停止済み(2026-07-31)。workflow_dispatchでの手動実行のみ。
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'youtube' || github.event.inputs.job == 'both')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      # cookie認証時、yt-dlpはwebクライアントにフォールバックしYouTubeの"n challenge"署名解決に
      # JSランタイムを要求する。ランナー内蔵のNodeはActions自体の実行専用でPATHに出ていないため明示的に用意する。
      - name: Set up Node.js (for yt-dlp's n-challenge JS solver)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -q yt-dlp google-genai
      - name: Check Environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/check_env.py
      - name: Process youtube queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 既存バッチが使っている SUPABASE_KEY を流用（SUPABASE_SERVICE_KEYがあればそちら優先）
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
        run: python scripts/youtube_worker.py

  dict-sync:
    # 2026-10-02: 旧ポータル(my-work-8jbd)の knowledge/sync を呼んでいたが、KTM_CRON_SECRET が
    # 未設定のため毎回「スキップ」して成功表示になっており、9月以降何も同期していなかった。
    # 05_PILOT の /api/knowledge/integrate（承認済みの記事だけを辞典へ統合）へ切り替えた。
    # 必要シークレット: PILOT_SECRET_TOKEN（Vercel ktm-pilot の同名の環境変数と同じ値）
    # 未設定のときはスキップではなく失敗させ、止まっていることに気づけるようにする。
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'dict-sync' || github.event.inputs.job == 'both') || (github.event_name == 'schedule' && github.event.schedule == '7 */3 * * *')
    runs-on: ubuntu-latest
    steps:
      - name: Integrate approved library articles into the champion dictionary
        env:
          PILOT_TOKEN: ${{ secrets.PILOT_SECRET_TOKEN }}
        run: |
          if [ -z "$PILOT_TOKEN" ]; then echo "::error::PILOT_SECRET_TOKEN が未設定のため辞典への統合を実行できません"; exit 1; fi
          BASE="https://ktm-pilot.vercel.app/api/knowledge/integrate"
          AFTER=0
          TOTAL=0
          for i in $(seq 1 40); do
            RES=$(curl -s -X POST "$BASE" -H "Authorization: Bearer $PILOT_TOKEN" -H "Content-Type: application/json"               -d "{\"mode\":\"batch\",\"onlyApproved\":true,\"afterId\":$AFTER,\"limit\":15}")
            echo "$RES"
            # error(全体の失敗) と errors(記事・チャンピオン単位の失敗) の両方を見る。
            # 2026-10-02の初回実行は errors だけが返り、全件失敗なのにジョブが成功表示になった。
            ERR=$(echo "$RES" | python3 -c "import sys,json;d=json.load(sys.stdin);e=d.get('error') or ' / '.join(d.get('errors') or []);print(e)" 2>/dev/null || echo "invalid response")
            if [ -n "$ERR" ]; then echo "::error::統合APIがエラーを返しました: $ERR"; exit 1; fi
            N=$(echo "$RES" | python3 -c "import sys,json;print(json.load(sys.stdin).get('integrated',0))")
            TOTAL=$((TOTAL + N))
            DONE=$(echo "$RES" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('done',True))")
            NEXT=$(echo "$RES" | python3 -c "import sys,json;print(json.load(sys.stdin).get('nextAfterId') or '')")
            if [ "$DONE" = "True" ] || [ -z "$NEXT" ]; then break; fi
            AFTER=$NEXT
          done
          echo "辞典へ統合した記事: ${TOTAL}件"
