name: KTM Bot Cron Backup

# Cloudflare Workersのcronはbest-effortで稀に発火が飛ぶ(#85)。
# 各定期処理の15分後にGitHub Actionsから /trigger-scheduled を冗長キックする。
# BOT側に二重投稿防止(直近同一通知チェック / recruitments.start_atチェック)があるため、
# 両方発火しても重複投稿にはならない。
#
# 必要なシークレット:
#   KTM_WORKER_URL  : ワーカーの公開URL (例: https://ktm-os-worker.xxxx.workers.dev)
#   KTM_TRIGGER_KEY : /trigger-scheduled の key（未設定ならデフォルト値を使用）

on:
  schedule:
    - cron: '15 3 * * 3'     # 水 12:15 JST (UTC 03:15) → 週末定期カスタム募集投稿のバックアップ
    - cron: '15 10 * * 5'    # 金 19:15 JST (UTC 10:15) → 金曜中間アナウンスのバックアップ
    - cron: '15 8 * * 6'     # 土 17:15 JST (UTC 08:15) → 土曜中間アナウンスのバックアップ
    - cron: '15 8 * * 0'     # 日 17:15 JST (UTC 08:15) → 日曜中間アナウンスのバックアップ
    # 2026-09-21追加: wrangler.tomlのCloudflareネイティブcron曜日ズレ修正時、④(20:00開催判定)には
    # これまでバックアップが一切無く、日曜分が構造的に一度も発火していなかったことが判明した。
    # 他のジョブと同じ「本来時刻+15分」の設計で追加する（checkCustomStatusAt2000側に
    # 二重投稿防止ガードも追加済み）。⑤(週間レポート)はDM送信のため、既存コメントの通り
    # 意図的にバックアップ対象外のまま維持する（二重送信防止、wrangler.toml側の曜日修正のみで対応）。
    - cron: '15 11 * * 6'    # 土 20:15 JST (UTC 11:15) → 土曜20:00開催判定のバックアップ
    - cron: '15 11 * * 0'    # 日 20:15 JST (UTC 11:15) → 日曜20:00開催判定のバックアップ
  workflow_dispatch:
    inputs:
      mode:
        description: 'mode (event_notify=人数集計アナウンス / weekly_recruit=定期募集 / check_2000=20:00開催判定)'
        required: false
        default: ''

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled handler
        env:
          WORKER_URL: ${{ secrets.KTM_WORKER_URL }}
          TRIGGER_KEY: ${{ secrets.KTM_TRIGGER_KEY }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::KTM_WORKER_URL シークレットが未設定です。リポジトリ Settings > Secrets に追加してください。"
            exit 1
          fi
          KEY="${TRIGGER_KEY:-ktm_v3_internal_secret_2026}"

          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "15 3 * * 3" ]; then
              MODE="weekly_recruit"
            elif [ "${{ github.event.schedule }}" = "15 10 * * 5" ] || [ "${{ github.event.schedule }}" = "15 8 * * 6" ] || [ "${{ github.event.schedule }}" = "15 8 * * 0" ]; then
              MODE="event_notify"
            elif [ "${{ github.event.schedule }}" = "15 11 * * 6" ] || [ "${{ github.event.schedule }}" = "15 11 * * 0" ]; then
              MODE="check_2000"
            else
              MODE=""
            fi
          fi

          echo "Kicking mode='$MODE'"
          STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" "$WORKER_URL/trigger-scheduled?key=$KEY&mode=$MODE")
          cat /tmp/resp.txt
          if [ "$STATUS" != "200" ]; then
            echo "::error::trigger-scheduled failed with HTTP $STATUS"
            exit 1
          fi
