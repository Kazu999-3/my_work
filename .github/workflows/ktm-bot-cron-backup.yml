name: KTM Bot Cron Backup

# Cloudflare Workersのcronはbest-effortで稀に発火が飛ぶ(#85)。
# 各定期処理の15分後にGitHub Actionsから /trigger-scheduled を冗長キックする。
# BOT側に二重投稿防止(直近同一通知チェック / recruitments.start_atチェック)があるため、
# 両方発火しても重複投稿にはならない。
#
# 必要なシークレット:
#   KTM_WORKER_URL  : ワーカーの公開URL (例: https://ktm-os-worker.xxxx.workers.dev)
#   KTM_TRIGGER_KEY : /trigger-scheduled の key（未設定ならデフォルト値を使用）

on:
  schedule:
    # 水・金・土 20:15 JST → 直前通知のバックアップ。
    # wrangler.toml本体のスケジュール(0 11 * * 3,5,6)は水・金・土を同格で扱っているのに、
    # このバックアップは金・土しか対象にしておらず、Cloudflare側のネイティブcronが
    # best-effortで飛んだ場合に水曜日だけ拾う保険が無かった（水曜アナウンス欠落の原因）。
    - cron: '15 11 * * 3,5,6'
    - cron: '10 12 * * 6'    # 土 21:10 JST → 翌週定期カスタム募集投稿のバックアップ
  workflow_dispatch:
    inputs:
      mode:
        description: 'mode (空=直前通知 / weekly_recruit=定期募集)'
        required: false
        default: ''

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled handler
        env:
          WORKER_URL: ${{ secrets.KTM_WORKER_URL }}
          TRIGGER_KEY: ${{ secrets.KTM_TRIGGER_KEY }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::KTM_WORKER_URL シークレットが未設定です。リポジトリ Settings > Secrets に追加してください。"
            exit 1
          fi
          KEY="${TRIGGER_KEY:-ktm_v3_internal_secret_2026}"

          # 手動実行なら入力modeを使用。スケジュール実行なら「実際にマッチしたcron式」
          # (github.event.schedule)で判定する。以前は実行時の現在時刻(UTC時)が12時かどうか
          # だけで判定していたため、GitHub Actionsのスケジュール実行が大きく遅延して
          # 金曜20:15 JST用のcronがUTC12時台にずれ込むと、誤って土曜用のweekly_recruitモードで
          # 発火してしまうバグがあった（定期カスタム募集が火曜に届いた原因）。
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "10 12 * * 6" ]; then MODE="weekly_recruit"; else MODE=""; fi
          fi

          echo "Kicking mode='$MODE'"
          STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" "$WORKER_URL/trigger-scheduled?key=$KEY&mode=$MODE")
          cat /tmp/resp.txt
          if [ "$STATUS" != "200" ]; then
            echo "::error::trigger-scheduled failed with HTTP $STATUS"
            exit 1
          fi
