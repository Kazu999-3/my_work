name: YouTube Absorber (Whisper Rescue)

# クラウド側 ktm-cloud-worker.yml（youtube job）が字幕なしと判定した動画
# （youtube_queue: status=error_no_transcript）を、Groq Whisper API で文字起こし
# して救済し、KireiLoL攻略バイブル(02_FACTORY/bible/kirei_bible/)を生成する。
#
# 以前はローカルGPU(faster-whisper/CUDA)前提だったため無効化していたが、
# 文字起こしをGroqのクラウドAPIに移行したことでActions上でも動くようになった。
# 対象は status=error_no_transcript のみに限定しているため、pending を奪い合う
# youtube job とは競合しない。
#
# 必要シークレット: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY(またはSUPABASE_KEY),
#                   GEMINI_API_KEY, GROQ_API_KEY, YOUTUBE_COOKIES_TXT
#                   （YOUTUBE_COOKIES_TXT: ブラウザ拡張機能等でエクスポートしたNetscape形式の
#                     cookies.txtの中身をそのまま貼る）
#
# 2026-07-31: 定期実行を停止した。cookie認証・yt-dlpの--js-runtimes/--remote-components
# 修正・android_vrクライアント化まで行っても、GitHub Actionsの共有IP自体がYouTube側から
# 低信用と判定され、動画によって "Sign in to confirm you're not a bot" や
# "Requested format is not available" が再発する（同じ動画を別IPから叩くと成功する）。
# クラウドで安定しないと判断し、workflow_dispatchでの手動実行のみ残す。
on:
  workflow_dispatch:
    # 参照・検証用の手動実行（定期cronは2026-07-31に停止。上記コメント参照）

permissions:
  contents: write   # バイブル(02_FACTORY/bible/kirei_bible/)をコミットで永続化するため

jobs:
  run-absorber:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # cookie認証時、yt-dlpは(androidクライアントがcookieを扱えないため)webクライアントに
      # フォールバックし、YouTubeの"n challenge"署名解決にJSランタイムを要求する。
      # ランナー内蔵のNodeはActions自体の実行専用でPATHに出ていないため、明示的に用意する。
      - name: Set up Node.js (for yt-dlp's n-challenge JS solver)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r 03_SYSTEMS/requirements.txt
          pip install -q yt-dlp

      - name: Run YouTube Absorber (Whisper rescue)
        id: absorb
        continue-on-error: true
        env:
          PYTHONPATH: 03_SYSTEMS
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PORTAL_URL: https://my-work-8jbd.vercel.app
          PORTAL_BOT_SECRET: ${{ secrets.PORTAL_BOT_SECRET }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
        run: python 03_SYSTEMS/v2_CORE/_LOL/youtube_absorber.py

      - name: Commit updated bible
        if: always()
        run: |
          git config --global user.name 'Antigravity Auditor'
          git config --global user.email 'auditor@antigravity.local'
          git add 02_FACTORY/bible/kirei_bible/
          git commit -m "chore: update KireiLoL bible via Whisper rescue [skip ci]" || echo "No changes to commit"
          git push

      # ポータルの「自動化パイプラインステータス」パネルは edge_tasks の task_type を見て
      # 鮮度判定している。以前(faster-whisper時代)は edge_worker_daemon.py がSupabase経由で
      # 起票していたため自然に反映されていたが、このワークフローは edge_tasks を一切
      # 経由しないため、champ-dict-update.yml と同様に完了レコードを明示的に残す。
      - name: Report run to portal pipeline status
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: |
          STATUS="completed"
          if [ "${{ steps.absorb.outcome }}" != "success" ]; then STATUS="failed"; fi
          curl -sf -X POST "$SUPABASE_URL/rest/v1/edge_tasks" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"task_type\":\"youtube_absorb\",\"status\":\"$STATUS\",\"payload\":{\"source\":\"github_actions\"}}" \
            || echo "⚠️ pipeline-status への完了報告に失敗しましたが、処理自体には影響ありません"
